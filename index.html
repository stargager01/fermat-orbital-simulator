<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페르마 나선 오비탈 시뮬레이션 대시보드 v2</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── DESIGN SYSTEM & CONSTANTS ── */
:root {
  --bg: #07080f;
  --surf: #0c0e1a;
  --card: #111524;
  --border: rgba(255, 255, 255, 0.07);
  --border-glow: rgba(255, 255, 255, 0.15);
  
  --text: #d5dce8;
  --text-bright: #ffffff;
  --dim: #5c6479;
  
  /* Orbital colors */
  --s: #f5a94a;
  --s-glow: rgba(245, 169, 74, 0.2);
  --p: #4fc3f7;
  --p-glow: rgba(79, 195, 247, 0.2);
  --d: #72d48a;
  --d-glow: rgba(114, 212, 138, 0.2);
  --f: #ce93d8;
  --f-glow: rgba(206, 147, 216, 0.2);
  
  /* Highlights & alerts */
  --ex: #ff6b6b;
  --ex-glow: rgba(255, 107, 107, 0.25);
  --rel: #00e5ff;
  --rel-glow: rgba(0, 229, 255, 0.25);
  --warn: #ffa726;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'EB Garamond', serif;
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

/* ── HEADER ── */
header {
  position: sticky;
  top: 0;
  z-index: 200;
  background: rgba(7, 8, 15, 0.96);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}

.logo-section .eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  letter-spacing: 3px;
  color: var(--dim);
  text-transform: uppercase;
  margin-bottom: 4px;
}

.logo-section h1 {
  font-size: 1.3rem;
  font-weight: 500;
  font-style: italic;
  letter-spacing: -0.5px;
}

.logo-section h1 strong {
  font-style: normal;
  font-weight: 700;
  color: var(--s);
}

.htabs {
  display: flex;
  gap: 6px;
  background: rgba(255, 255, 255, 0.02);
  padding: 4px;
  border-radius: 4px;
  border: 1px solid var(--border);
}

.htab {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  padding: 8px 16px;
  border-radius: 2px;
  border: none;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.htab:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.04);
}

.htab.active {
  color: var(--s);
  background: rgba(245, 169, 74, 0.1);
  box-shadow: inset 0 0 0 1px rgba(245, 169, 74, 0.25);
}

.hlegend {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

.hleg {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--dim);
}

.hleg-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

/* ── LAYOUT ── */
.app {
  display: grid;
  grid-template-columns: 1fr 390px;
  min-height: calc(100vh - 72px);
}

@media (max-width: 1100px) {
  .app {
    grid-template-columns: 1fr;
  }
}

.left-panel {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.right-panel {
  border-left: 1px solid var(--border);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow-y: auto;
  max-height: calc(100vh - 72px);
  position: sticky;
  top: 72px;
}

/* ── PERIODIC TABLE ── */
.pt-scroll {
  overflow-x: auto;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.01);
  padding: 12px;
}

.sec-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--dim);
  text-transform: uppercase;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.pt-grid {
  display: grid;
  grid-template-columns: repeat(18, minmax(30px, 1fr));
  gap: 2px;
  min-width: 580px;
}

.pt-cell {
  aspect-ratio: 1;
  border-radius: 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  background: var(--card);
  position: relative;
}

.pt-cell:hover {
  transform: scale(1.15);
  z-index: 10;
  border-color: var(--border-glow);
}

.pt-cell.active {
  z-index: 20;
}

.pt-cell.empty {
  background: transparent;
  border: none;
  pointer-events: none;
}

.pt-cell .sym {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(8px, 1vw, 11px);
  font-weight: 600;
  line-height: 1;
}

.pt-cell .num {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(5px, 0.7vw, 7.5px);
  color: var(--dim);
  line-height: 1;
  margin-top: 2px;
}

/* Highlights on cells */
.pt-cell .ex-dot {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--ex);
  box-shadow: 0 0 4px var(--ex);
}

.pt-cell .rel-dot {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--rel);
  box-shadow: 0 0 4px var(--rel);
}

/* Block styles */
.pt-cell.s-block { border-color: rgba(245, 169, 74, 0.15); }
.pt-cell.s-block .sym { color: var(--s); }
.pt-cell.p-block { border-color: rgba(79, 195, 247, 0.15); }
.pt-cell.p-block .sym { color: var(--p); }
.pt-cell.d-block { border-color: rgba(114, 212, 138, 0.15); }
.pt-cell.d-block .sym { color: var(--d); }
.pt-cell.f-block { border-color: rgba(206, 147, 216, 0.15); }
.pt-cell.f-block .sym { color: var(--f); }

.pt-cell.active.s-block { background: var(--s-glow); border-color: var(--s); box-shadow: 0 0 10px var(--s-glow); }
.pt-cell.active.p-block { background: var(--p-glow); border-color: var(--p); box-shadow: 0 0 10px var(--p-glow); }
.pt-cell.active.d-block { background: var(--d-glow); border-color: var(--d); box-shadow: 0 0 10px var(--d-glow); }
.pt-cell.active.f-block { background: var(--f-glow); border-color: var(--f); box-shadow: 0 0 10px var(--f-glow); }

/* Periodic table dynamic highlights based on tab */
.pt-grid.highlight-ex .pt-cell.has-ex {
  animation: ex-pulse 1.8s infinite alternate;
}
@keyframes ex-pulse {
  from { border-color: rgba(255, 107, 107, 0.3); box-shadow: 0 0 2px rgba(255, 107, 107, 0.1); }
  to { border-color: var(--ex); box-shadow: 0 0 12px rgba(255, 107, 107, 0.6); }
}

.pt-grid.highlight-rel .pt-cell.has-rel {
  animation: rel-pulse 1.8s infinite alternate;
}
@keyframes rel-pulse {
  from { border-color: rgba(0, 229, 255, 0.3); box-shadow: 0 0 2px rgba(0, 229, 255, 0.1); }
  to { border-color: var(--rel); box-shadow: 0 0 12px rgba(0, 229, 255, 0.6); }
}

/* ── SIMULATOR CANVAS BOX ── */
.cbox {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.cbox-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.cbox-title {
  font-size: 1.15rem;
  font-style: italic;
  color: var(--text-bright);
}

.cbox-title strong {
  font-style: normal;
}

.cbox-title span {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--dim);
  margin-left: 8px;
}

.ctrls {
  display: flex;
  gap: 8px;
  align-items: center;
}

.cbtn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 6px 14px;
  border-radius: 2px;
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--border);
  color: var(--text);
}

.cbtn.on {
  border-color: var(--s);
  color: var(--s);
  background: rgba(245, 169, 74, 0.05);
}

.cbtn:hover {
  border-color: var(--text);
  background: rgba(255, 255, 255, 0.02);
}

.slider-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--dim);
}

input[type=range] {
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 4px;
  height: 5px;
  width: 70px;
  outline: none;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  background: var(--s);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 5px var(--s);
  transition: transform 0.1s;
}

input[type=range]::-webkit-slider-thumb:hover {
  transform: scale(1.3);
}

.canvas-row {
  display: flex;
  gap: 24px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.canvas-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  transition: all 0.3s ease;
}

.canvas-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--dim);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

canvas {
  background: radial-gradient(circle, rgba(255, 255, 255, 0.015) 0%, transparent 70%);
  border-radius: 50%;
  border: 1px solid var(--border);
  image-rendering: -webkit-optimize-contrast; /* Sharp canvas rendering */
}

/* ── ENERGY DIAGRAM BOX ── */
.ediag {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px;
}

#ediagCanvas {
  width: 100%;
  height: 160px;
  border: none;
  background: transparent;
  border-radius: 0;
}

/* ── SIDEBAR CARDS ── */
.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--dim);
  text-transform: uppercase;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
}

/* Element Info Card */
.ecard {
  background: var(--card);
  border-radius: 4px;
  padding: 20px;
  border: 1px solid var(--border);
}

.ecard-top {
  display: flex;
  align-items: flex-start;
  gap: 16px;
}

.ecard-top .big-sym {
  font-family: 'JetBrains Mono', monospace;
  font-size: 3rem;
  font-weight: 600;
  line-height: 1;
}

.ecard-info {
  flex: 1;
}

.ecard-info .ename {
  font-size: 1.25rem;
  font-style: italic;
  color: var(--text-bright);
}

.ecard-info .emeta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--dim);
  margin-top: 2px;
  line-height: 1.7;
}

.econfig {
  margin-top: 12px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 2px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  line-height: 1.6;
  word-break: break-all;
  border: 1px solid rgba(255, 255, 255, 0.02);
}

.badge-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8.5px;
  padding: 4px 10px;
  border-radius: 12px;
  letter-spacing: 0.5px;
  font-weight: 500;
}

.badge.ex {
  background: rgba(255, 107, 107, 0.08);
  border: 1px solid rgba(255, 107, 107, 0.3);
  color: var(--ex);
}

.badge.rel {
  background: rgba(0, 229, 255, 0.08);
  border: 1px solid rgba(0, 229, 255, 0.3);
  color: var(--rel);
}

.badge.stable {
  background: rgba(114, 212, 138, 0.08);
  border: 1px solid rgba(114, 212, 138, 0.25);
  color: var(--d);
}

/* Layer Toggle rows */
.layers {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.lrow {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--card);
  border-radius: 3px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}

.lrow:hover {
  border-color: rgba(255, 255, 255, 0.12);
}

.lrow.on {
  border-color: var(--lc);
  background: color-mix(in srgb, var(--lc) 8%, var(--card));
}

.ltog {
  width: 16px;
  height: 16px;
  border-radius: 3px;
  border: 2px solid var(--lc);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.lrow.on .ltog {
  background: var(--lc);
}

.lcheck {
  font-size: 9px;
  color: var(--bg);
  font-weight: bold;
  display: none;
}

.lrow.on .lcheck {
  display: block;
}

.linfo {
  flex: 1;
}

.lname {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-bright);
  font-weight: 600;
}

.lname span {
  color: var(--dim);
  font-weight: 300;
}

.lform {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  color: var(--dim);
  margin-top: 2px;
}

.lelec {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
}

/* Quantum Numbers Card */
.qngrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.qnbox {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 8px;
  text-align: center;
}

.qnval {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--text-bright);
}

.qnlbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  color: var(--dim);
  margin-top: 4px;
  letter-spacing: 0.5px;
}

/* Exchange Energy Panel */
.expanel {
  background: var(--card);
  border-radius: 4px;
  padding: 16px;
  border: 1px solid var(--border);
}

.ex-eq {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  line-height: 1.8;
  color: var(--text);
}

.ex-eq .hi { color: var(--ex); font-weight: 600; }
.ex-eq .hi2 { color: var(--warn); }

.ex-bars {
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.ex-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.ex-bar-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--dim);
  width: 75px;
  flex-shrink: 0;
}

.ex-bar-bg {
  flex: 1;
  height: 6px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 3px;
  overflow: hidden;
}

.ex-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.8s cubic-bezier(0.1, 0.8, 0.2, 1);
}

.ex-bar-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  width: 25px;
  text-align: right;
  flex-shrink: 0;
  font-weight: bold;
}

.ex-note-desc {
  margin-top: 12px;
  font-size: 0.85rem;
  color: rgba(255, 107, 107, 0.85);
  line-height: 1.6;
  border-top: 1px dashed rgba(255, 107, 107, 0.15);
  padding-top: 10px;
}

/* Relativistic Panel */
.relpanel {
  background: var(--card);
  border-radius: 4px;
  padding: 16px;
  border: 1px solid var(--border);
}

.rel-meters {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.rel-meter {
  background: rgba(255, 255, 255, 0.02);
  border-radius: 4px;
  padding: 12px 8px;
  border: 1px solid var(--border);
  text-align: center;
}

.rel-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--rel);
}

.rel-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  color: var(--dim);
  margin-top: 4px;
  letter-spacing: 0.5px;
}

.rel-bar-wrap {
  margin-top: 10px;
}

.rel-bar-bg {
  width: 100%;
  height: 4px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 2px;
  overflow: hidden;
}

.rel-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.8s cubic-bezier(0.1, 0.8, 0.2, 1);
}

.rel-note-desc {
  margin-top: 12px;
  font-size: 0.85rem;
  color: rgba(0, 229, 255, 0.85);
  line-height: 1.6;
  border-top: 1px dashed rgba(0, 229, 255, 0.15);
  padding-top: 10px;
}

/* Math Panel */
.mathpanel {
  background: var(--card);
  border-radius: 4px;
  padding: 16px;
  border: 1px solid var(--border);
}

.meq {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  line-height: 2.1;
  color: var(--dim);
}

.meq b {
  color: var(--text-bright);
}

.meq .mc {
  color: var(--s);
  font-weight: bold;
}

.pdesc {
  font-size: 0.88rem;
  color: var(--dim);
  line-height: 1.7;
  margin-top: 10px;
  border-top: 1px solid var(--border);
  padding-top: 10px;
}

/* Placeholder */
.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 200px;
  color: var(--dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  text-align: center;
  gap: 12px;
}

.placeholder svg {
  opacity: 0.2;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 4px;
  height: 4px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--dim);
  border-radius: 2px;
}

/* ── VIEW TAB FILTER VISIBILITY ── */
/* Custom visibility mapping */
.view-orbital .exch-only,
.view-orbital .rel-only,
.view-exchange .rel-only,
.view-relativistic .exch-only {
  display: none !important;
}

.view-dashboard .exch-only,
.view-dashboard .rel-only {
  display: block !important;
}

/* When relativistic comparison is shown */
.rel-canvas-wrap {
  display: none;
}
.view-relativistic .rel-canvas-wrap,
.view-dashboard .rel-canvas-wrap {
  display: flex;
}
</style>
</head>
<body>

<header>
  <div class="logo-section">
    <div class="eyebrow">Fermat Spiral Orbital Simulator · v2.0 Integrated</div>
    <h1><em>페르마 나선</em>으로 보는 <strong>오비탈 전자 구조</strong></h1>
  </div>
  <div class="htabs">
    <button class="htab active" onclick="switchTab('orbital', event)">오비탈</button>
    <button class="htab" onclick="switchTab('exchange', event)">교환 에너지</button>
    <button class="htab" onclick="switchTab('relativistic', event)">상대론적 효과</button>
    <button class="htab" onclick="switchTab('dashboard', event)">종합 대시보드</button>
  </div>
  <div class="hlegend">
    <div class="hleg"><div class="hleg-dot" style="background:var(--s)"></div>s-block</div>
    <div class="hleg"><div class="hleg-dot" style="background:var(--p)"></div>p-block</div>

// ═══════════════════════════════════════════
// ELECTRON CONFIGURATION PARSER
// ═══════════════════════════════════════════
function parseConfig(cfg) {
  const stripped = cfg.replace(/\[[A-Za-z]+\]/, '');
  const layers = [];
  const re = /(\d)([spdfg])([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g;
  const sup = { '⁰': 0, '¹': 1, '²': 2, '³': 3, '⁴': 4, '⁵': 5, '⁶': 6, '⁷': 7, '⁸': 8, '⁹': 9 };
  
  let m;
  while ((m = re.exec(stripped)) !== null) {
    const n = parseInt(m[1]);
    const type = m[2];
    const eStr = m[3];
    
    // Multi-digit superscript parser (e.g. ¹⁰ -> 10, ¹⁴ -> 14)
    let e = 0;
    for (const char of eStr) {
      e = e * 10 + (sup[char] !== undefined ? sup[char] : 0);
    }
    
    const l = { s: 0, p: 1, d: 2, f: 3, g: 4 }[type];
    layers.push({ n, type, l, electrons: e });
  }
  return layers;
}

// Exchange energy calculator C(n, 2)
function exchangeEnergy(n) {
  return n > 1 ? (n * (n - 1)) / 2 : 0;
}

// ═══════════════════════════════════════════
// BUILD PERIODIC TABLE GRID
// ═══════════════════════════════════════════
function getGridPosition(el) {
  const { period: p, group: g, block: b, z } = el;
  if (b === 'f') {
    // Lanthanides (57-71) -> Row 9, Columns 3..17
    if (z >= 57 && z <= 71) return { r: 9, c: z - 57 + 3 };
    // Actinides (89-103) -> Row 10, Columns 3..17
    if (z >= 89 && z <= 103) return { r: 10, c: z - 89 + 3 };
  }
  return { r: p, c: g };
}

function buildPeriodicTable() {
  const ptGrid = document.getElementById('ptGrid');
  const ROWS = 10;
  const COLS = 18;
  
  const grid = Array.from({ length: ROWS + 1 }, () => Array(COLS + 1).fill(null));
  
  ELEMENTS.forEach(el => {
    const pos = getGridPosition(el);
    if (pos && pos.r <= ROWS && pos.c >= 1 && pos.c <= COLS) {
      grid[pos.r][pos.c] = el;
    }
  });
  
  for (let r = 1; r <= ROWS; r++) {
    if (r === 8) {
      // Gap spacing row
      for (let c = 1; c <= COLS; c++) {
        const div = document.createElement('div');
        div.className = 'pt-cell empty';
        ptGrid.appendChild(div);
      }
      continue;
    }
    
    for (let c = 1; c <= COLS; c++) {
      const el = grid[r][c];
      const div = document.createElement('div');
      
      if (!el) {
        div.className = 'pt-cell empty';
      } else {
        div.className = `pt-cell ${el.block}-block`;
        if (el.ex) div.classList.add('has-ex');
        if (el.rel > 0.5) div.classList.add('has-rel');
        
        div.id = `el-cell-${el.z}`;
        div.innerHTML = `<span class="sym">${el.sym}</span><span class="num">${el.z}</span>`;
        
        // Ex/Rel visual dots
        if (el.ex) div.innerHTML += '<div class="ex-dot" title="예외 배치의 오비탈"></div>';
        if (el.rel > 0.5) div.innerHTML += '<div class="rel-dot" title="강한 상대론적 수축/팽창 효과"></div>';
        
        div.title = `${el.name} (${el.sym}, Z=${el.z})`;
        div.addEventListener('click', () => selectElement(el));
      }
      ptGrid.appendChild(div);
    }
  }
}

// ═══════════════════════════════════════════
// DUAL CANVAS SIMULATION RENDERER
// ═══════════════════════════════════════════
const mainCanvas = document.getElementById('mainCanvas');
const relCanvas = document.getElementById('relCanvas');

let mCtx, rCtx;
let animAngle = 0;
let animRunning = false;
let animId = null;
let currentLayers = [];
let layerVisible = {};
let selectedEl = null;

// Handle rotation speed dynamically
function getAnimSpeed() {
  const val = document.getElementById('speedSlider').value;
  return parseFloat(val) * 0.001;
}

function toggleAnim() {
  animRunning = !animRunning;
  const btn = document.getElementById('animBtn');
  if (animRunning) {
    btn.textContent = '회전 ON';
    btn.classList.add('on');
    animate();
  } else {
    btn.textContent = '회전 OFF';
    btn.classList.remove('on');
    if (animId) cancelAnimationFrame(animId);
    redraw();
  }
}

function animate() {
  animAngle += getAnimSpeed();
  redraw();
  if (animRunning) animId = requestAnimationFrame(animate);
}

function initCanvases() {
  // Clear and setup dimensions
  mCtx = initCanvas('mainCanvas', 330, 330);
  rCtx = initCanvas('relCanvas', 330, 330);
}

function initCanvas(canvasId, logicalW, logicalH) {
  const canvas = document.getElementById(canvasId);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = logicalW * dpr;
  canvas.height = logicalH * dpr;
  canvas.style.width = `${logicalW}px`;
  canvas.style.height = `${logicalH}px`;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  return ctx;
}

function redraw() {
  const appContainer = document.getElementById('appContainer');
  const isRelTab = appContainer.classList.contains('view-relativistic') || appContainer.classList.contains('view-dashboard');
  
  drawAllLayers(mainCanvas, mCtx, animAngle, false);
  if (isRelTab && selectedEl) {
    drawAllLayers(relCanvas, rCtx, animAngle, true);
  }
}

function drawAllLayers(canvas, ctx, rot = 0, isRelativistic = false) {
  const cx = canvas.width / (2 * (window.devicePixelRatio || 1));
  const cy = canvas.height / (2 * (window.devicePixelRatio || 1));
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Radial background glow
  const bgGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, cx);
  bgGlow.addColorStop(0, 'rgba(255, 255, 255, 0.015)');
  bgGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = bgGlow;
  ctx.fillRect(0, 0, cx * 2, cy * 2);
  
  if (currentLayers.length === 0) return;
  
  // ── Global dynamic scale calculations so sizes are visually proportioned ──
  let globalScale = 1;
  const maxN = Math.max(...currentLayers.map(l => l.n));
  const maxT = Math.PI * (2.5 + maxN * 1.2);
  const rawExtent = Math.sqrt(maxT) * (maxN * 34 + 18);
  const targetExtent = cx * 0.86;
  if (rawExtent > targetExtent) {
    globalScale = targetExtent / rawExtent;
  }
  
  // Render each layer back-to-front (core layers first)
  currentLayers.forEach(layer => {
    if (!layerVisible[layer.id]) return;
    drawFermatOrbital(ctx, cx, cy, layer, rot, globalScale, isRelativistic);
  });
  
  // Center nucleus particle glow
  const nucleusGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 8);
  nucleusGlow.addColorStop(0, '#ffffff');
  nucleusGlow.addColorStop(0.35, isRelativistic ? 'rgba(0, 229, 255, 0.6)' : 'rgba(245, 169, 74, 0.6)');
  nucleusGlow.addColorStop(1, 'transparent');
  
  ctx.beginPath();
  ctx.arc(cx, cy, 8, 0, Math.PI * 2);
  ctx.fillStyle = nucleusGlow;
  ctx.fill();
  
  // Relativistic watermark text label overlay
  if (isRelativistic) {
    ctx.font = '500 9px JetBrains Mono, monospace';
    ctx.fillStyle = 'rgba(0, 229, 255, 0.45)';
    ctx.textAlign = 'left';
    ctx.fillText('RELATIVISTIC CORRECTED', 10, 20);
  }
}

function drawFermatOrbital(ctx, cx, cy, layer, rot, globalScale = 1, isRelativistic = false) {
  const { n, l, electrons, color, maxEl } = layer;
  
  // Relativistic scaling corrections
  // s orbitals contract due to speed, d & f orbitals expand slightly due to outer screening
  let relCorr = 1.0;
  if (isRelativistic) {
    if (l === 0) relCorr = 0.76;
    else if (l >= 2) relCorr = 1.16;
  }
  
  const baseScale = (n * 34 + 18) * globalScale * relCorr;
  const opacity = 0.35 + 0.55 * (electrons / maxEl);
  const STEPS = 1000;
  const maxT = Math.PI * (2.5 + n * 1.2);
  
  ctx.save();
  ctx.translate(cx, cy);
  
  // Apply rotation speeds relative to angular momentum numbers
  const speedCoeff = l === 0 ? 0.25 : l === 1 ? 1.0 : l === 2 ? -0.65 : 0.45;
  ctx.rotate(rot * speedCoeff);
  
  const hexToRgba = (hex, a) => {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${a})`;
  };
  
  // 1. Draw outer boundary fills (shading density)
  ctx.beginPath();
  let first = true;
  for (let i = 0; i <= STEPS; i++) {
    const t = (i / STEPS) * maxT;
    let r = (l === 0) ? Math.sqrt(t) * 0.95 : Math.sqrt(t) * Math.abs(Math.cos(l * t));
    const px = r * baseScale * Math.cos(t);
    const py = r * baseScale * Math.sin(t);
    if (first) { ctx.moveTo(px, py); first = false; }
    else ctx.lineTo(px, py);
  }
  for (let i = STEPS; i >= 0; i--) {
    const t = (i / STEPS) * maxT;
    let r = (l === 0) ? Math.sqrt(t) * 0.55 : Math.sqrt(t) * Math.abs(Math.cos(l * t)) * 0.55;
    const px = r * baseScale * Math.cos(t);
    const py = r * baseScale * Math.sin(t);
    ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = hexToRgba(color, opacity * 0.14);
  ctx.fill();
  
  // 2. Main spiral line stroke
  ctx.beginPath();
  first = true;
  for (let i = 0; i <= STEPS; i++) {
    const t = (i / STEPS) * maxT;
    let r = (l === 0) ? Math.sqrt(t) : Math.sqrt(t) * Math.abs(Math.cos(l * t));
    const px = r * baseScale * Math.cos(t);
    const py = r * baseScale * Math.sin(t);
    if (first) { ctx.moveTo(px, py); first = false; }
    else ctx.lineTo(px, py);
  }
  
  // Draw primary sharp stroke
  ctx.strokeStyle = hexToRgba(color, opacity * 0.85);
  ctx.lineWidth = 1.1 + (electrons / maxEl) * 0.8;
  ctx.stroke();
  
  // Draw secondary glow stroke
  ctx.strokeStyle = hexToRgba(color, opacity * 0.22);
  ctx.lineWidth = 3.5 + (electrons / maxEl) * 3;
  ctx.stroke();
  
  ctx.restore();
}

// ═══════════════════════════════════════════
// ENERGY DIAGRAM CANVAS
// ═══════════════════════════════════════════
function drawEnergyDiag(el, layers) {
  const cv = document.getElementById('ediagCanvas');
  
  // High-DPI setup for energy diagram
  const dpr = window.devicePixelRatio || 1;
  const logicalW = cv.parentElement.clientWidth - 40;
  const logicalH = 160;
  cv.width = logicalW * dpr;
  cv.height = logicalH * dpr;
  cv.style.width = `${logicalW}px`;
  cv.style.height = `${logicalH}px`;
  
  const ctx = cv.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  
  ctx.clearRect(0, 0, logicalW, logicalH);
  if (!layers || layers.length === 0) return;
  
  const pad = { l: 60, r: 30, t: 25, b: 35 };
  const iW = logicalW - pad.l - pad.r;
  const iH = logicalH - pad.t - pad.b;
  
  // Calculate relative levels
  const levels = layers.map(lay => {
    const baseE = -(el.z * el.z) / (2 * lay.n * lay.n) * 0.22;
    const relAdj = el.rel * (lay.l === 0 ? -12 : lay.l >= 2 ? +7 : 0);
    return { ...lay, energy: baseE + relAdj, unshifted: baseE };
  });
  
  const minE = Math.min(...levels.map(l => l.energy)) - 5;
  const maxE = 5;
  const eRange = maxE - minE;
  
  function eToY(e) {
    return pad.t + (1 - (e - minE) / eRange) * iH;
  }
  
  function xForIdx(i) {
    return pad.l + 30 + (i / Math.max(1, levels.length)) * iW * 0.85;
  }
  
  // Axis ticks grid
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
  ctx.lineWidth = 0.5;
  for (let e = Math.ceil(minE / 10) * 10; e <= maxE; e += 10) {
    const y = eToY(e);
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(logicalW - pad.r, y);
    ctx.stroke();
  }
  
  // Y Axis Energy Line
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.l, pad.t);
  ctx.lineTo(pad.l, pad.t + iH);
  ctx.stroke();
  
  ctx.font = '9px JetBrains Mono, monospace';
  ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.textAlign = 'right';
  ctx.fillText('E (a.u.)', pad.l - 6, pad.t + 4);
  
  // Render energy levels
  levels.forEach((lay, i) => {
    const x = xForIdx(i);
    const y = eToY(lay.energy);
    const color = OC[lay.type] || '#fff';
    
    // Draw relativistic shift guides
    if (el.rel > 0.1 && Math.abs(lay.energy - lay.unshifted) > 0.1) {
      const yUnshifted = eToY(lay.unshifted);
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.18)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 3]);
      ctx.beginPath();
      ctx.moveTo(x - 22, yUnshifted);
      ctx.lineTo(x + 22, yUnshifted);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(x, yUnshifted);
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    
    // Setup subshell orbital lines (1, 3, 5, 7 lines based on angular momentum)
    const l = lay.l;
    const nOrb = 2 * l + 1;
    const spacing = 12;
    const orbitalWidth = 8;
    const totalW = (nOrb - 1) * spacing + orbitalWidth;
    const startX = x - totalW / 2;
    
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    for (let o = 0; o < nOrb; o++) {
      const ox = startX + o * spacing;
      ctx.beginPath();
      ctx.moveTo(ox, y);
      ctx.lineTo(ox + orbitalWidth, y);
      ctx.stroke();
      
      // Compute Hund's Rule Electron distribution in degenerate states
      const eCount = lay.electrons;
      const hasUp = eCount > o;
      const hasDown = eCount > nOrb + o;
      
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      
      // Draw Spin Up vertical arrow
      if (hasUp) {
        const arrowX = ox + 2.5;
        ctx.beginPath();
        ctx.moveTo(arrowX, y + 4);
        ctx.lineTo(arrowX, y - 5);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(arrowX - 1.2, y - 3);
        ctx.lineTo(arrowX, y - 5);
        ctx.lineTo(arrowX + 1.2, y - 3);
        ctx.stroke();
      }
      
      // Draw Spin Down vertical arrow
      if (hasDown) {
        const arrowX = ox + 5.5;
        ctx.beginPath();
        ctx.moveTo(arrowX, y - 4);
        ctx.lineTo(arrowX, y + 5);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(arrowX - 1.2, y + 3);
        ctx.lineTo(arrowX, y + 5);
        ctx.lineTo(arrowX + 1.2, y + 3);
        ctx.stroke();
      }
    }
    
    // Subshell text title (e.g. 3d)
    ctx.font = '10px JetBrains Mono, monospace';
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.fillText(`${lay.n}${lay.type}`, x, y - 10);
    
    // Electron occupancy
    const isExSubshell = el.ex && (lay.type === 'd' || lay.type === 'f');
    ctx.fillStyle = isExSubshell ? 'var(--ex)' : 'rgba(255, 255, 255, 0.4)';
    ctx.font = '500 9px JetBrains Mono, monospace';
    ctx.fillText(`${lay.electrons}e⁻`, x, y + 15);
    
    // Relativistic effect shifts
    if (el.rel > 0.45 && lay.l === 0) {
      ctx.fillStyle = 'var(--rel)';
      ctx.font = '8px sans-serif';
      ctx.fillText('↓rel', x + totalW / 2 + 10, y + 3);
    } else if (el.rel > 0.45 && lay.l >= 2) {
      ctx.fillStyle = 'var(--rel)';
      ctx.font = '8px sans-serif';
      ctx.fillText('↑rel', x + totalW / 2 + 10, y + 3);
    }
  });
  
  // Red warning banner for exception configurations
  if (el.ex) {
    ctx.strokeStyle = 'rgba(255, 107, 107, 0.25)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.strokeRect(pad.l + 4, pad.t + 4, logicalW - pad.l - pad.r - 8, logicalH - pad.t - pad.b - 8);
    ctx.setLineDash([]);
    
    ctx.font = '600 8.5px JetBrains Mono, monospace';
    ctx.fillStyle = 'var(--ex)';
    ctx.textAlign = 'left';
    ctx.fillText('ANOMALOUS CONFIGURATION (예외적 전자 배치)', pad.l + 10, pad.t + 13);
  }
}

// ═══════════════════════════════════════════
// INTERACTIVE SELECTION HANDLER
// ═══════════════════════════════════════════
function selectElement(el) {
  if (selectedEl) {
    const prevCell = document.getElementById(`el-cell-${selectedEl.z}`);
    if (prevCell) prevCell.classList.remove('active');
  }
  
  selectedEl = el;
  const cell = document.getElementById(`el-cell-${el.z}`);
  if (cell) cell.classList.add('active');
  
  // Parse configurations into orbit layers
  const parsed = parseConfig(el.config);
  const maxElMap = { s: 2, p: 6, d: 10, f: 14, g: 18 };
  
  currentLayers = parsed.map(lay => ({
    ...lay,
    id: `${lay.n}${lay.type}`,
    color: OC[lay.type] || '#fff',
    maxEl: maxElMap[lay.type] || 2
  }));
  
  // Reset visibility mappings
  layerVisible = {};
  currentLayers.forEach(l => {
    layerVisible[l.id] = true;
  });
  
  // Dynamic header state title updates
  document.getElementById('canvasTitle').innerHTML = `
    <strong style="color:${OC[el.block]}">${el.sym}</strong>
    <span style="font-style:italic; font-size: 0.95rem; color: var(--text-bright)"> ${el.name}</span>
    <span>Z = ${el.z} &nbsp;·&nbsp; 원자량 = ${el.mass} u</span>
  `;
  
  // Re-render
  redraw();
  drawEnergyDiag(el, currentLayers);
  buildSidebar(el, parsed);
}

// ═══════════════════════════════════════════
// SIDEBAR DETAIL CONSTRUCTORS
// ═══════════════════════════════════════════
function buildSidebar(el, layers) {
  const rp = document.getElementById('rightPanel');
  const blockColor = OC[el.block];
  const outer = layers[layers.length - 1];
  
  // Hund's Exchange Energy values
  const maxCapacity = { s: 2, p: 6, d: 10, f: 14 }[outer.type] || 2;
  const maxSingleFill = maxCapacity / 2;
  
  // Hund's rule: maximum parallel spins
  const nUp = Math.min(outer.electrons, maxSingleFill);
  const EexActual = exchangeEnergy(nUp);
  
  // If it's an exception, the expected standard Aufbau would have fewer parallel spins
  // Usually, Aufbau has 1 less electron in d/f subshell and 1 more in s subshell.
  const EexExpected = el.ex ? exchangeEnergy(nUp - 1) : EexActual;
  
  // Relativistic v/c estimates
  const vOverC = (el.z / 137) / outer.n;
  const relativisticGamma = 1 / Math.sqrt(1 - vOverC * vOverC);
  
  rp.innerHTML = `
    <!-- ELEMENT CARD -->
    <div>
      <div class="section-label">원소 기본 정보</div>
      <div class="ecard">
        <div class="ecard-top">
          <div class="big-sym" style="color:${blockColor}">${el.sym}</div>
          <div class="ecard-info">
            <div class="ename">${el.name}</div>
            <div class="emeta">Z = ${el.z} &nbsp;·&nbsp; ${el.period}주기 &nbsp;·&nbsp; ${el.block}-블록</div>
          </div>
        </div>
        <div class="econfig">${el.config}</div>
        <div class="badge-row">
          ${el.ex ? '<span class="badge ex">예외 전자 배치</span>' : '<span class="badge stable">Aufbau 원리 충족</span>'}
          ${el.rel > 0.48 ? '<span class="badge rel">강한 상대론적 효과</span>' : ''}
        </div>
      </div>
    </div>

    <!-- LAYER TOGGLES -->
    <div>
      <div class="section-label">오비탈 레이어 개별 제어</div>
      <div class="layers" id="layerList"></div>
    </div>

    <!-- STANDARD DETAILS / ORBITAL INFO -->
    <div class="std-only">
      <div class="section-label">최외각 껍질 양자수</div>
      <div class="qngrid">
        <div class="qnbox">
          <div class="qnval" style="color:${blockColor}">${outer.n}</div>
          <div class="qnlbl">주양자수 (n)</div>
        </div>
        <div class="qnbox">
          <div class="qnval" style="color:${blockColor}">${outer.l}</div>
          <div class="qnlbl">방위양자수 (l)</div>
        </div>
        <div class="qnbox">
          <div class="qnval" style="color:${blockColor}">${outer.electrons}</div>
          <div class="qnlbl">전자 수 (e⁻)</div>
        </div>
      </div>
    </div>

    <!-- EXCHANGE ENERGY DETAIL PANEL -->
    <div class="exch-only">
      <div class="section-label">Hund 교환 에너지 비교 (E_ex)</div>
      <div class="expanel">
        <div class="ex-eq">
          E<sub>ex</sub> = K × C(n<sub>↑</sub>, 2) = K × <span class="hi">${EexActual}</span><br>
          <span style="color:var(--dim)">n<sub>↑</sub>(동일 스핀 전자) = ${nUp}개</span><br>
          ${el.ex ? '<span class="hi2">→ 궤도 반충전/완충으로 E_ex 최대화 달성</span>' : ''}
        </div>
        <div class="ex-bars" id="exBars"></div>
        ${el.ex ? `<div class="ex-note-desc"><strong>배치 원인:</strong> ${el.exNote}</div>` : ''}
      </div>
    </div>

    <!-- RELATIVISTIC EFFECT DETAIL PANEL -->
    <div class="rel-only">
      <div class="section-label">상대론적 물리 효과 보정</div>
      <div class="relpanel">
        <div class="rel-meters">
          <div class="rel-meter">
            <div class="rel-val" style="color:var(--rel)">${(vOverC * 100).toFixed(1)}%</div>
            <div class="rel-lbl">내각 전자의 v/c 속도</div>
            <div class="rel-bar-wrap">
              <div class="rel-bar-bg"><div class="rel-bar-fill" style="width:${Math.min(vOverC * 100, 100)}%; background:var(--rel); box-shadow:0 0 4px var(--rel)"></div></div>
            </div>
          </div>
          <div class="rel-meter">
            <div class="rel-val" style="color:var(--warn)">${relativisticGamma.toFixed(3)}</div>
            <div class="rel-lbl">상대론적 질량배수 (γ)</div>
            <div class="rel-bar-wrap">
              <div class="rel-bar-bg"><div class="rel-bar-fill" style="width:${Math.min((relativisticGamma - 1) * 350, 100)}%; background:var(--warn); box-shadow:0 0 4px var(--warn)"></div></div>
            </div>
          </div>
        </div>
        <div class="rel-note-desc">
          <strong>상대론적 변동 효과:</strong> ${el.relNote ? el.relNote : `원자번호 Z=${el.z}의 중원소 영역입니다. 내각 1s 전자가 빛의 속도의 약 ${(el.z/137*100).toFixed(1)}%에 도달하며 질량이 증가하고, 이로 인해 s 오비탈의 상대론적 수축과 d/f 오비탈의 차폐 스크리닝 간접 팽창이 발생합니다.`}
        </div>
      </div>
    </div>

    <!-- FERMAT MATHEMATICAL FORMULA -->
    <div>
      <div class="section-label">페르마 나선 수학 공식</div>
      <div class="mathpanel">
        <div class="meq">
          <b>r = √θ · |cos(<span class="mc">${outer.l}</span>·θ)|</b><br>
          <span>반경 껍질 스케일 = ${outer.n}</span><br>
          ${layers.map(l => `<span style="color:${OC[l.type]}">${l.n}${l.type}</span>: l=${l.l}, e=${l.electrons}`).join('<br>')}
        </div>
        <div class="pdesc">
          ${getPhysDesc(el.block)}
        </div>
      </div>
    </div>
  `;
  
  // Render Hund's rule bar charts
  const exBars = document.getElementById('exBars');
  if (exBars) {
    const barData = [
      { label: '실제 배치 (Hund)', val: EexActual, color: 'var(--ex)' },
      { label: 'Aufbau 예측', val: EexExpected, color: 'rgba(255,255,255,0.2)' }
    ];
    const maxVal = Math.max(EexActual, EexExpected, 1);
    exBars.innerHTML = barData.map(b => `
      <div class="ex-bar-row">
        <div class="ex-bar-lbl">${b.label}</div>
        <div class="ex-bar-bg"><div class="ex-bar-fill" style="width:${(b.val / maxVal) * 100}%; background:${b.color}"></div></div>
        <div class="ex-bar-val" style="color:${b.color}">${b.val}</div>
      </div>
    `).join('');
  }
  
  // Draw Layer Toggles inside the list
  const ll = document.getElementById('layerList');
  currentLayers.forEach(lay => {
    const row = document.createElement('div');
    row.className = 'lrow on';
    row.style.setProperty('--lc', OC[lay.type] || '#fff');
    row.dataset.lid = lay.id;
    row.innerHTML = `
      <div class="ltog"><span class="lcheck">✓</span></div>
      <div class="linfo">
        <div class="lname">${lay.n}${lay.type} <span>(l=${lay.l})</span></div>
        <div class="lform">r = √θ · |cos(${lay.l}θ)|</div>
      </div>
      <div class="lelec" style="color:${OC[lay.type]}">${lay.electrons}e⁻</div>
    `;
    
    row.addEventListener('click', () => {
      layerVisible[lay.id] = !layerVisible[lay.id];
      row.classList.toggle('on', layerVisible[lay.id]);
      redraw();
    });
    
    ll.appendChild(row);
  });
}

function getPhysDesc(block) {
  const descs = {
    s: 's-블록 원소: l=0 구형 대칭 나선 구조를 가집니다. 전자 분포가 무지향성을 띠며, 수식 상 각도 노드가 존재하지 않고 모든 구역에 고르게 분포합니다.',
    p: 'p-블록 원소: l=1 아령 형태를 가집니다. |cos θ| 각도 변조로 인해 90도와 270도 영역에 오비탈 파동방정식의 각도 노드가 명확히 형성되어 지향성 결합의 물리적 토대가 됩니다.',
    d: 'd-블록 원소: l=2 네 잎 클로버 형상(4엽)의 오비탈을 이룹니다. 45도 간격의 4개 방향에 오비탈 노드가 발생하며, 전이 원소들의 화려한 배위 구조와 독특한 색채, 강한 영구자성 등의 근원이 됩니다.',
    f: 'f-block 원소: l=3 다엽 구조의 대칭 복합 형태를 이룹니다. 내각 오비탈 차폐 효과로 외부 화학적 껍질에 의한 결합성 변화는 적지만, 강한 스핀 오비탈 궤도 결합에 따른 큰 자기 모멘트가 특징입니다.'
  };
  return descs[block] || '';
}

// ═══════════════════════════════════════════
// TABS NAVIGATION CONTROLLER
// ═══════════════════════════════════════════
function switchTab(tabName, event) {
  // Update tabs
  document.querySelectorAll('.htab').forEach(btn => btn.classList.remove('active'));
  if (event) {
    event.currentTarget.classList.add('active');
  } else {
    // Lookup by string
    const targetTab = Array.from(document.querySelectorAll('.htab')).find(b => b.textContent.includes(tabName));
    if (targetTab) targetTab.classList.add('active');
  }
  
  // Set layout mode on container
  const appContainer = document.getElementById('appContainer');
  appContainer.className = `app view-${tabName}`;
  
  // Periodic table highlighter class toggles
  const ptGrid = document.getElementById('ptGrid');
  ptGrid.classList.remove('highlight-ex', 'highlight-rel');
  
  if (tabName === 'exchange') {
    ptGrid.classList.add('highlight-ex');
  } else if (tabName === 'relativistic') {
    ptGrid.classList.add('highlight-rel');
  }
  
  // Refresh canvas sizes and redrawing loops
  redraw();
  if (selectedEl) {
    drawEnergyDiag(selectedEl, currentLayers);
  }
}

});
