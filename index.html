<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페르마 나선 오비탈 시뮬레이터</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@300;400;600&display=swap');

:root {
  --bg: #08090e;
  --surface: #0d1020;
  --card: #111827;
  --border: rgba(255,255,255,0.07);
  --text: #d4dbe8;
  --dim: #4a5568;
  --s: #f5a623; --s-glow: rgba(245,166,35,0.2);
  --p: #4fc3f7; --p-glow: rgba(79,195,247,0.2);
  --d: #81c784; --d-glow: rgba(129,199,132,0.2);
  --f: #ce93d8; --f-glow: rgba(206,147,216,0.2);
  --g: #ffb74d; --g-glow: rgba(255,183,77,0.2);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}

body {
  background:var(--bg);
  color:var(--text);
  font-family:'Libre Baskerville',serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── HEADER ── */
header {
  padding:32px 40px 24px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:flex-end; justify-content:space-between;
  flex-wrap:wrap; gap:12px;
  position:sticky; top:0; z-index:100;
  background:rgba(8,9,14,0.95);
  backdrop-filter:blur(12px);
}
.header-left .eyebrow {
  font-family:'JetBrains Mono',monospace;
  font-size:9px; letter-spacing:3px; color:var(--dim);
  text-transform:uppercase; margin-bottom:6px;
}
.header-left h1 {
  font-size:clamp(1.1rem,2.5vw,1.6rem);
  font-weight:400; font-style:italic;
  line-height:1.2;
}
.header-left h1 strong { font-style:normal; font-weight:700; }
.legend {
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
}
.leg { display:flex; align-items:center; gap:5px;
  font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--dim);
}
.leg-dot { width:8px; height:8px; border-radius:50%; }

/* ── LAYOUT ── */
.app { display:grid; grid-template-columns:1fr 380px; min-height:calc(100vh - 85px); }
@media(max-width:1000px){ .app { grid-template-columns:1fr; } }

/* ── LEFT: periodic table + canvas ── */
.left-panel { padding:24px 20px 24px 32px; display:flex; flex-direction:column; gap:20px; }

/* Periodic table */
.pt-wrap { overflow-x:auto; }
.pt-label {
  font-family:'JetBrains Mono',monospace;
  font-size:9px; letter-spacing:3px; color:var(--dim);
  text-transform:uppercase; margin-bottom:10px;
}
.pt-grid {
  display:grid;
  grid-template-columns: repeat(18, minmax(34px,1fr));
  gap:2px;
  min-width:640px;
}
.pt-cell {
  aspect-ratio:1;
  border-radius:2px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  cursor:pointer;
  border:1px solid transparent;
  transition:all .15s;
  position:relative;
  background:var(--card);
}
.pt-cell:hover { transform:scale(1.12); z-index:10; }
.pt-cell.active { z-index:20; }
.pt-cell .sym {
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(8px,1.1vw,11px);
  font-weight:600; line-height:1;
}
.pt-cell .num {
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(6px,0.8vw,8px);
  color:var(--dim); line-height:1; margin-top:1px;
}
.pt-cell.empty { background:transparent; border:none; cursor:default; pointer-events:none; }
.pt-cell.gap-label {
  background:transparent; border:none; cursor:default; pointer-events:none;
  font-family:'JetBrains Mono',monospace; font-size:8px; color:var(--dim);
  justify-content:flex-end; padding-bottom:4px;
}

/* block colors */
.pt-cell.s-block { border-color:rgba(245,166,35,0.25); }
.pt-cell.s-block .sym { color:var(--s); }
.pt-cell.p-block { border-color:rgba(79,195,247,0.25); }
.pt-cell.p-block .sym { color:var(--p); }
.pt-cell.d-block { border-color:rgba(129,199,132,0.25); }
.pt-cell.d-block .sym { color:var(--d); }
.pt-cell.f-block { border-color:rgba(206,147,216,0.25); }
.pt-cell.f-block .sym { color:var(--f); }

.pt-cell.active.s-block { background:var(--s-glow); border-color:var(--s); box-shadow:0 0 12px var(--s-glow); }
.pt-cell.active.p-block { background:var(--p-glow); border-color:var(--p); box-shadow:0 0 12px var(--p-glow); }
.pt-cell.active.d-block { background:var(--d-glow); border-color:var(--d); box-shadow:0 0 12px var(--d-glow); }
.pt-cell.active.f-block { background:var(--f-glow); border-color:var(--f); box-shadow:0 0 12px var(--f-glow); }

/* ── CANVAS AREA ── */
.canvas-section {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:4px;
  padding:20px;
  display:flex; flex-direction:column; gap:16px;
}
.canvas-header {
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
}
.canvas-title {
  font-size:1.1rem; font-style:italic;
}
.canvas-title strong { font-style:normal; }
.anim-btn {
  font-family:'JetBrains Mono',monospace;
  font-size:9px; letter-spacing:2px; text-transform:uppercase;
  padding:6px 14px; border-radius:2px;
  background:transparent; cursor:pointer; transition:all .2s;
}
.anim-btn.on  { border:1px solid var(--s); color:var(--s); }
.anim-btn.off { border:1px solid var(--dim); color:var(--dim); }

.canvas-wrap {
  display:flex; justify-content:center; align-items:center;
  position:relative;
}
#orbitalCanvas {
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.02) 0%, transparent 70%);
}

/* ── RIGHT PANEL ── */
.right-panel {
  border-left:1px solid var(--border);
  padding:24px 24px 40px;
  display:flex; flex-direction:column; gap:20px;
  overflow-y:auto; max-height:calc(100vh - 85px);
  position:sticky; top:85px;
}

.section-label {
  font-family:'JetBrains Mono',monospace;
  font-size:9px; letter-spacing:3px; color:var(--dim);
  text-transform:uppercase; margin-bottom:10px;
  padding-bottom:6px; border-bottom:1px solid var(--border);
}

/* Element info card */
.elem-card {
  background:var(--card); border-radius:4px; padding:18px;
  border:1px solid var(--border);
}
.elem-card .big-sym {
  font-family:'JetBrains Mono',monospace;
  font-size:3rem; font-weight:600; line-height:1;
}
.elem-card .elem-name { font-size:1.1rem; font-style:italic; margin-top:4px; }
.elem-card .elem-meta {
  font-family:'JetBrains Mono',monospace;
  font-size:10px; color:var(--dim); margin-top:8px; line-height:1.7;
}
.elem-card .config {
  margin-top:10px; padding:8px 12px;
  background:rgba(255,255,255,0.03);
  border-radius:2px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px; color:var(--text);
  line-height:1.6; word-break:break-all;
}

/* Layer toggles */
.layers { display:flex; flex-direction:column; gap:6px; }
.layer-row {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px;
  background:var(--card); border-radius:3px;
  border:1px solid var(--border);
  cursor:pointer; transition:all .15s; user-select:none;
}
.layer-row:hover { border-color:rgba(255,255,255,0.15); }
.layer-row.active { border-color:var(--lc); background:color-mix(in srgb, var(--lc) 10%, var(--card)); }
.layer-toggle {
  width:16px; height:16px; border-radius:3px;
  border:2px solid var(--lc); background:transparent;
  transition:background .15s; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.layer-row.active .layer-toggle { background:var(--lc); }
.layer-check { font-size:9px; color:var(--bg); display:none; }
.layer-row.active .layer-check { display:block; }
.layer-info { flex:1; }
.layer-name {
  font-family:'JetBrains Mono',monospace;
  font-size:11px; color:var(--text); font-weight:600;
}
.layer-formula {
  font-family:'JetBrains Mono',monospace;
  font-size:9px; color:var(--dim); margin-top:2px;
}
.layer-electrons {
  font-family:'JetBrains Mono',monospace;
  font-size:10px; color:var(--lc); font-weight:600;
}

/* Math panel */
.math-panel {
  background:var(--card); border-radius:4px; padding:16px;
  border:1px solid var(--border);
}
.math-eq {
  font-family:'JetBrains Mono',monospace;
  font-size:11px; color:var(--text); line-height:2;
}
.math-eq span { color:var(--dim); }
.math-highlight { color:var(--s) !important; }

.phys-desc {
  font-size:0.88rem; color:var(--dim);
  line-height:1.75; margin-top:10px;
}

/* Quantum numbers */
.qn-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
}
.qn-box {
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:3px; padding:10px 8px; text-align:center;
}
.qn-val {
  font-family:'JetBrains Mono',monospace;
  font-size:1.1rem; font-weight:600;
}
.qn-lbl {
  font-family:'JetBrains Mono',monospace;
  font-size:8px; color:var(--dim); margin-top:3px; letter-spacing:1px;
}

/* placeholder */
.placeholder {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:200px; color:var(--dim);
  font-family:'JetBrains Mono',monospace; font-size:11px;
  letter-spacing:2px; text-align:center; gap:12px;
}
.placeholder svg { opacity:.3; }

/* scrollbar */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px;}
</style>
</head>

// ═══════════════════════════════════════════
// Parse electron config → orbital layers
// ═══════════════════════════════════════════
function parseConfig(cfg) {
  // strip noble gas core
  const stripped = cfg.replace(/\[[A-Za-z]+\]/,'');
  const layers = [];
  const re = /(\d)([spdf])([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g;
  const sup = {'⁰':0,'¹':1,'²':2,'³':3,'⁴':4,'⁵':5,'⁶':6,'⁷':7,'⁸':8,'⁹':9,'¹⁰':10,'¹¹':11,'¹²':12,'¹³':13,'¹⁴':14};
  let m;
  while((m = re.exec(stripped)) !== null){
    const n = parseInt(m[1]);
    const type = m[2];
    const eStr = m[3];
    let e = 0;
    // handle multi-char superscripts
    let i=0;
    while(i < eStr.length){
      if(i+1 < eStr.length && sup[eStr[i]+eStr[i+1]] !== undefined){
        e = e*10 + sup[eStr[i]+eStr[i+1]]; i+=2;
      } else {
        e = e*10 + (sup[eStr[i]]||0); i++;
      }
    }
    if(e===0) e = sup[eStr]||1;
    const l = {s:0,p:1,d:2,f:3,g:4}[type];
    layers.push({ n, type, l, electrons: e });
  }
  return layers;
}

// BUILD PERIODIC TABLE
// ═══════════════════════════════════════════
const ptGrid = document.getElementById('ptGrid');

// Position map [z] = {row, col} (1-indexed)
function getPos(el) {
  const {period: p, group: g, block: b, z} = el;
  if(b==='f'){
    // lanthanides 57-71 => row 9 (period 6 series), col z-57+3 = col 3..17
    // actinides 89-103  => row 10, col z-89+3
    if(z>=57 && z<=71) return {row:9, col: z-57+3};
    if(z>=89 && z<=103) return {row:10, col: z-89+3};
  }
  return {row: p, col: g};
}

// 10 rows: 7 main + blank + 2 f-block
const ROWS = 10, COLS = 18;
const grid = Array.from({length:ROWS+1}, ()=>Array(COLS+1).fill(null));

ELEMENTS.forEach(el => {
  const pos = getPos(el);
  if(pos && pos.row <= ROWS && pos.col >= 1 && pos.col <= COLS){
    grid[pos.row][pos.col] = el;
  }
});

// render
for(let row=1; row<=ROWS; row++){
  if(row===8){
    // gap row
    for(let c=1;c<=COLS;c++){
      const div=document.createElement('div');
      div.className='pt-cell empty';
      ptGrid.appendChild(div);
    }
    continue;
  }
  for(let col=1; col<=COLS; col++){
    const el = grid[row][col];
    if(!el){
      const div=document.createElement('div');
      div.className='pt-cell empty';
      ptGrid.appendChild(div);
    } else {
      const div=document.createElement('div');
      div.className=`pt-cell ${el.block}-block`;
      div.id=`el-${el.z}`;
      div.innerHTML=`<span class="sym">${el.sym}</span><span class="num">${el.z}</span>`;
      div.title=`${el.name} (${el.z})`;
      div.addEventListener('click',()=>selectElement(el));
      ptGrid.appendChild(div);
    }
  }
}

// ═══════════════════════════════════════════
// ORBITAL CANVAS RENDERER
// ═══════════════════════════════════════════
const canvas = document.getElementById('orbitalCanvas');
const ctx = canvas.getContext('2d');
const CX = canvas.width/2, CY = canvas.height/2;

let animAngle = 0;
let animRunning = false;
let animId = null;
let currentLayers = [];
let layerVisible = {};

function toggleAnim(){
  animRunning = !animRunning;
  const btn = document.getElementById('animBtn');
  if(animRunning){
    btn.textContent='● 회전 ON'; btn.classList.add('on'); btn.classList.remove('off');
    animate();
  } else {
    btn.textContent='● 회전 OFF'; btn.classList.add('off'); btn.classList.remove('on');
    if(animId) cancelAnimationFrame(animId);
    drawAllLayers(animAngle);
  }
}

function animate(){
  animAngle += 0.008;
  drawAllLayers(animAngle);
  if(animRunning) animId = requestAnimationFrame(animate);
}

function drawAllLayers(rot=0){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // background glow
  const gr = ctx.createRadialGradient(CX,CY,0,CX,CY,CX);
  gr.addColorStop(0,'rgba(255,255,255,0.015)');
  gr.addColorStop(1,'transparent');
  ctx.fillStyle=gr; ctx.fillRect(0,0,canvas.width,canvas.height);

  // ── 전역 스케일 계산: 가장 바깥 레이어가 캔버스에 꼭 맞게 ──
  let globalScale = 1;
  if(currentLayers.length > 0){
    const maxN = Math.max(...currentLayers.map(l=>l.n));
    const maxT = Math.PI * (3 + maxN * 1.5);
    const rawExtent = Math.sqrt(maxT) * (maxN * 38 + 20) * (canvas.width / 420);
    const target = CX * 0.88;
    if(rawExtent > target) globalScale = target / rawExtent;
  }

  // draw each layer
  currentLayers.forEach(layer=>{
    if(!layerVisible[layer.id]) return;
    drawFermatOrbital(layer, rot, globalScale);
  });

  // center nucleus
  const ng = ctx.createRadialGradient(CX,CY,0,CX,CY,8);
  ng.addColorStop(0,'rgba(255,255,255,0.9)');
  ng.addColorStop(0.4,'rgba(200,220,255,0.5)');
  ng.addColorStop(1,'transparent');
  ctx.beginPath(); ctx.arc(CX,CY,8,0,Math.PI*2);
  ctx.fillStyle=ng; ctx.fill();
}

function drawFermatOrbital(layer, rot, globalScale=1){
  const {n, l, electrons, color, maxEl} = layer;
  const scale = (n * 38 + 20) * (canvas.width/420) * globalScale;
  const opacity = 0.4 + 0.5*(electrons/maxEl);
  const STEPS = 1200;
  const maxT = Math.PI * (3 + n*1.5);

  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(rot * (l===0 ? 0.3 : l===1 ? 1 : l===2 ? -0.7 : 0.5));

  // filled region
  ctx.beginPath();
  let first=true;
  for(let i=0;i<=STEPS;i++){
    const t=(i/STEPS)*maxT;
    let r;
    if(l===0) r=Math.sqrt(t)*0.95;
    else r=Math.sqrt(t)*Math.abs(Math.cos(l*t));
    const px=r*scale*Math.cos(t), py=r*scale*Math.sin(t);
    if(first){ctx.moveTo(px,py);first=false;} else ctx.lineTo(px,py);
  }
  for(let i=STEPS;i>=0;i--){
    const t=(i/STEPS)*maxT;
    let r;
    if(l===0) r=Math.sqrt(t)*0.55;
    else r=Math.sqrt(t)*Math.abs(Math.cos(l*t))*0.55;
    const px=r*scale*Math.cos(t), py=r*scale*Math.sin(t);
    ctx.lineTo(px,py);
  }
  ctx.closePath();
  const hexToRgba=(hex,a)=>{
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  };
  ctx.fillStyle=hexToRgba(color, opacity*0.18);
  ctx.fill();

  // main stroke
  ctx.beginPath(); first=true;
  for(let i=0;i<=STEPS;i++){
    const t=(i/STEPS)*maxT;
    let r;
    if(l===0) r=Math.sqrt(t);
    else r=Math.sqrt(t)*Math.abs(Math.cos(l*t));
    const px=r*scale*Math.cos(t), py=r*scale*Math.sin(t);
    if(first){ctx.moveTo(px,py);first=false;} else ctx.lineTo(px,py);
  }
  ctx.strokeStyle=hexToRgba(color, opacity*0.85);
  ctx.lineWidth=1.2+(electrons/maxEl)*0.8;
  ctx.stroke();

  // glow pass
  ctx.beginPath(); first=true;
  for(let i=0;i<=STEPS;i++){
    const t=(i/STEPS)*maxT;
    let r;
    if(l===0) r=Math.sqrt(t);
    else r=Math.sqrt(t)*Math.abs(Math.cos(l*t));
    const px=r*scale*Math.cos(t), py=r*scale*Math.sin(t);
    if(first){ctx.moveTo(px,py);first=false;} else ctx.lineTo(px,py);
  }
  ctx.strokeStyle=hexToRgba(color, opacity*0.25);
  ctx.lineWidth=4+(electrons/maxEl)*3;
  ctx.stroke();

  ctx.restore();
}

// SELECT ELEMENT
// ═══════════════════════════════════════════
let selectedEl = null;

function selectElement(el){
  // deselect prev
  if(selectedEl){
    const prev = document.getElementById(`el-${selectedEl.z}`);
    if(prev) prev.classList.remove('active');
  }
  selectedEl = el;
  const cell = document.getElementById(`el-${el.z}`);
  if(cell) cell.classList.add('active');

  // parse layers
  const layers = parseConfig(el.config);
  const maxElMap = {s:2,p:6,d:10,f:14,g:18};
  currentLayers = layers.map((lay,i)=>({
    ...lay,
    id: `${lay.n}${lay.type}`,
    color: OC[lay.type],
    maxEl: maxElMap[lay.type],
  }));
  layerVisible = {};
  currentLayers.forEach(l=>{ layerVisible[l.id]=true; });

  // draw
  drawAllLayers(animAngle);

  // update title
  document.getElementById('canvasTitle').innerHTML =
    `<strong style="color:${OC[el.block]}">${el.sym}</strong>
     <span style="font-style:italic;font-size:.9rem;color:var(--dim)"> ${el.name}</span>
     <span style="font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--dim);margin-left:8px">Z = ${el.z}</span>`;

  // update right panel
  buildRightPanel(el, layers);
}

        <div class="layer-name">${lay.n}${lay.type}  <span style="color:var(--dim);font-weight:300">(l=${lay.l})</span></div>
        <div class="layer-formula">r=√θ·|cos(${lay.l}θ)| · n=${lay.n}</div>
      </div>
      <div class="layer-electrons">${lay.electrons}e⁻</div>
    `;
    row.addEventListener('click',()=>{
      layerVisible[lay.id]=!layerVisible[lay.id];
      row.classList.toggle('active', layerVisible[lay.id]);
      drawAllLayers(animAngle);
    });
    ll.appendChild(row);
  });
}

function getPhysDesc(el, layers){
  const b=el.block;
  const descs={
    s:`s-블록 원소. 최외각 s 오비탈이 구형 대칭(l=0). 페르마 나선이 원형으로 수렴하며 방향성 없는 전자 분포를 표현.`,
    p:`p-블록 원소. l=1 오비탈이 두 로브의 아령형. |cos θ| 변조로 90°/270° 위치에 각도 노드 발생. 방향성 결합(혼성화)의 기원.`,
    d:`d-블록 전이 원소. l=2 오비탈이 4엽 구조. |cos 2θ| 변조로 45° 간격 노드 4개. 결정장 이론, 색깔, 자성의 물리적 원천.`,
    f:`f-블록 란타넘/악티늄족. l=3의 복잡한 다엽 구조. 내부 차폐로 화학 반응성이 낮으나 강한 자기 이방성과 방사능의 원천.`,
  };
  return descs[b]||'';
}
